<p-table #dt1 [value]="items"
[loading]="loading"
[scrollable]="true" scrollHeight="500px" [styleClass]="'overflow:visible'"
>
  <ng-template  #header>
      <tr>
        <th>senha</th>
        <th>data de criação</th>
        <th><p-button (onClick)="refresh()" icon="pi pi-replay" variant="text" [raised]="true"
          severity="info" size="large" /></th>
      </tr>
      <tr>
        <th>
        </th>
        <th>
          <p-datepicker size="small" [showIcon]="true" iconDisplay="input" appendTo="body" (onSelect)="search(date, 'createdDate')" [(ngModel)]="date" />
        </th>
        <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
      <tr>
          <td>{{ item.password }}</td>
          <td>{{ item.createdDate }}</td>

          <td class="justify-center">
            <p-button
            severity="danger"
            [outlined]="true"
            *ngIf="!isDelete || item.id != idDelete"
            (click)="visible = !visible; idDelete = item.id"
              icon="pi pi-trash" rounded="true" text="true" />
            <p-inputIcon class="margin-bottom" *ngIf="isDelete && item.id == idDelete" styleClass="pi pi-spinner pi-spin" />

            <p-dialog header="Atenção" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
              <span class="p-text-secondary block mb-8">Você realmente deseja deletar esta senha ?</span>
              <div class="justify-space-around margin-top-1em">
                <p-button label="Cancel" severity="secondary" (click)="visible = false" />
                  <p-button (click)="delete(idDelete)" label="Sim" severity="danger" />
              </div>
          </p-dialog>
          </td>
      </tr>

  </ng-template>
</p-table>


<p-paginator
(onPageChange)="handlePageEvent($event)"
[first]="first"
[rows]="rows"
[totalRecords]="totalRecords"
[rowsPerPageOptions]="[8,10, 20, 30]" />
