<p-table #dt1 [value]="items"
[loading]="loading"
[scrollable]="true" scrollHeight="500px"
>
  <ng-template  #header>
      <tr>
        <th>senha</th>
        <th>data de criação</th>
        <th><p-button (onClick)="refresh()" icon="pi pi-replay" variant="text" [raised]="true"
          severity="info" size="large" showIcon iconDisplay="input"/></th>
      </tr>
      <tr>
        <th>
        </th>
        <th>
          <p-datepicker size="small" (onSelect)="search(date, 'createdDate')" [(ngModel)]="date" />
        </th>
        <th></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-item>
      <tr>
          <td>{{ item.password }}</td>
          <td>{{ item.createdDate }}</td>
          <td></td>
      </tr>

  </ng-template>
</p-table>


<p-paginator
(onPageChange)="handlePageEvent($event)"
[first]="first"
[rows]="rows"
[totalRecords]="totalRecords"
[rowsPerPageOptions]="[8,10, 20, 30]" />
